services:
  - type: web
    name: tirelink-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npx tsx src/main.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        value: postgresql://tirelink_db_user:U3oI7O3RAPffvJRL1tt6V7Bb3RpiKTc5@dpg-d887fb57vvec73cr9g70-a/tirelink_db
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://devmatrix0530.github.io
      - key: PORT
        value: 10000
